<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora com Historico</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>calculadora com historico</h2>

        <div class="desing-inputs">
            <input type="number" id="num1" placeholder="coloque seu primeiro numero aqui">
            <input type="number" id="num2" placeholder="coloque seu segundo numero aqui">
        </div>


        <div class="buttons-area">
            <button class="button" data-operacao="soma">+</button>
            <button class="button" data-operacao="multiplicacao">×</button>
            <button class="button" data-operacao="subtracao">-</button>
            <button class="button" data-operacao="divisao">÷</button>
        </div>

        <div class="areadohistorico">
            <label>Historico</label>
            <div id="conteudodohistorico"></div>
        </div>
    </div>

    <script>
    $(document).ready(function(){
        $(".button").click(function(){
            var n1 = $("#num1").val();
            var n2 = $("#num2").val();
            var tipoOperacao = $(this).data("operacao");

            if(n1 === "" || n2 === "") {
                alert("Por favor, preencha ambos os números.");
                return;
            }

            
            $.ajax({
                url: "calculadora.php",
                type: "POST",
                data: {
                    num1: n1,
                    num2: n2,
                    calculo: tipoOperacao
                },
                dataType: "html",
                success: function(resultado) {
                    $("#conteudodohistorico").prepend("<p>" + resultado + "</p>");
                    
                    $("#num1").val("");
                    $("#num2").val("");
                },
                
            });
        });
    });
    </script>
</body>
</html>
